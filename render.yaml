services:
  - type: web
    name: bpsc-tre-pyq
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /assets/
        destination: /index.html
      - type: rewrite
        source: /assets
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
